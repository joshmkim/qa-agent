# Local Postgres for the control plane. Start with `pnpm db:up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_agent
    ports:
      # 5433 on the host so an existing local Postgres on 5432 doesn't clash.
      - "5433:5432"
    volumes:
      - qa-agent-db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  qa-agent-db:
